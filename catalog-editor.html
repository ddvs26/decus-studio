<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalog Editor — Decus 3D</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--carbon:#0F1419;--slate:#4A5A66;--sage:#8FA89B;--ivory:#F6F4F1;
  --fs:"Sora",system-ui,sans-serif;--fb:"Inter",system-ui,sans-serif}
body{font-family:var(--fb);background:var(--ivory);color:var(--carbon);min-height:100vh}
input,select,textarea,button{font-family:var(--fb)}

/* ── GATE ── */
#gate{position:fixed;inset:0;background:var(--carbon);display:flex;
  align-items:center;justify-content:center;z-index:9999}
.gate-box{background:#111d25;border:1px solid rgba(143,168,155,.2);border-radius:16px;
  padding:3rem;width:380px;text-align:center}
.gate-logo{font-family:var(--fs);font-size:1.4rem;font-weight:700;color:var(--ivory);margin-bottom:.5rem}
.gate-sub{font-size:.82rem;color:rgba(246,244,241,.4);margin-bottom:2rem}
.gate-box input{width:100%;padding:.8rem 1rem;border:1px solid rgba(255,255,255,.1);
  border-radius:8px;background:#0d1720;color:var(--ivory);font-size:1rem;
  letter-spacing:.1em;text-align:center;margin-bottom:1rem;outline:none}
.gate-box input:focus{border-color:var(--sage)}
.gate-btn{width:100%;background:var(--sage);color:var(--carbon);border:none;
  padding:.85rem;border-radius:8px;font-family:var(--fs);font-weight:700;
  font-size:.9rem;cursor:pointer;transition:background .2s}
.gate-btn:hover{background:#a0b9ac}
.gate-err{color:#e05555;font-size:.8rem;margin-top:.75rem;min-height:1.2em}

/* ── MAIN UI ── */
#app{display:none;padding:2rem;max-width:1100px;margin:0 auto}
.header{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:2rem;flex-wrap:wrap;gap:1rem}
.header h1{font-family:var(--fs);font-size:1.5rem;font-weight:700}
.header-actions{display:flex;gap:.75rem;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.65rem 1.25rem;
  border-radius:8px;font-family:var(--fs);font-weight:600;font-size:.85rem;
  cursor:pointer;border:none;transition:all .2s;text-decoration:none}
.btn-primary{background:var(--carbon);color:var(--ivory)}
.btn-primary:hover{background:#1e2d38}
.btn-sage{background:var(--sage);color:var(--carbon)}
.btn-sage:hover{background:#a0b9ac}
.btn-danger{background:#e05555;color:#fff}
.btn-danger:hover{background:#c0392b}
.btn-sm{padding:.4rem .8rem;font-size:.78rem}

/* ── PRODUCT LIST ── */
.prod-list{display:flex;flex-direction:column;gap:1rem}
.prod-row{background:#fff;border:1px solid rgba(74,90,102,.12);border-radius:12px;
  padding:1.25rem;display:grid;grid-template-columns:auto 1fr auto;gap:1.25rem;
  align-items:start}
.prod-index{font-family:var(--fs);font-size:1.2rem;font-weight:700;
  color:rgba(74,90,102,.3);min-width:28px;padding-top:.2rem}
.prod-fields{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem}
.prod-fields.wide{grid-template-columns:1fr 1fr}
.field{display:flex;flex-direction:column;gap:.3rem}
.field label{font-size:.7rem;font-weight:600;color:var(--slate);letter-spacing:.3px}
.field input,.field select,.field textarea{
  border:1px solid rgba(74,90,102,.18);border-radius:6px;padding:.55rem .75rem;
  font-size:.84rem;background:#fafaf9;color:var(--carbon);
  transition:border .2s,box-shadow .2s}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--sage);box-shadow:0 0 0 2px rgba(143,168,155,.15)}
.field textarea{resize:vertical;min-height:72px}
.prod-actions{display:flex;flex-direction:column;gap:.5rem}

/* ── ADD SECTION ── */
.add-section{margin-top:2rem;padding-top:2rem;border-top:1px solid rgba(74,90,102,.12)}
.add-section h2{font-family:var(--fs);font-size:1rem;font-weight:700;margin-bottom:1rem}
.new-prod-fields{background:#fff;border:1px solid rgba(143,168,155,.3);border-radius:12px;
  padding:1.5rem;display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem}

/* ── TOAST ── */
.toast{position:fixed;bottom:2rem;right:2rem;background:var(--carbon);color:var(--ivory);
  padding:.85rem 1.5rem;border-radius:10px;font-size:.88rem;font-weight:500;
  opacity:0;transform:translateY(8px);transition:all .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1;transform:none}
.toast.success{background:#2a7a48}
.toast.error{background:#c0392b}

/* ── STATUS BAR ── */
.status-bar{background:var(--carbon);color:rgba(246,244,241,.55);
  padding:.5rem 2rem;font-size:.78rem;display:flex;justify-content:space-between}

@media(max-width:700px){
  .prod-fields{grid-template-columns:1fr 1fr}
  .prod-row{grid-template-columns:1fr;gap:.75rem}
  .new-prod-fields{grid-template-columns:1fr 1fr}
}
@media(max-width:480px){
  .prod-fields,.new-prod-fields{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- ── PASSWORD GATE ── -->
<div id="gate">
  <div class="gate-box">
    <div class="gate-logo">Decus 3D · Editor</div>
    <p class="gate-sub">Acceso restringido — ingresá la clave de administrador</p>
    <input type="password" id="gate-pwd" placeholder="Contraseña" autocomplete="off">
    <button class="gate-btn" id="gate-btn">Entrar</button>
    <p class="gate-err" id="gate-err"></p>
  </div>
</div>

<!-- ── STATUS BAR ── -->
<div class="status-bar" id="status-bar" style="display:none">
  <span>Decus 3D Catalog Editor</span>
  <span id="status-info">Cargando...</span>
</div>

<!-- ── MAIN APP ── -->
<div id="app">
  <div class="header">
    <h1>Catálogo 3D</h1>
    <div class="header-actions">
      <button class="btn btn-sage" id="load-btn">Cargar catalog.json</button>
      <button class="btn btn-primary" id="export-btn">Exportar JSON</button>
    </div>
  </div>

  <div class="prod-list" id="prod-list"></div>

  <div class="add-section">
    <h2>Agregar producto</h2>
    <div class="new-prod-fields" id="new-form">
      <div class="field"><label>Nombre *</label><input id="n-name" placeholder="Porta tarjetas..."></div>
      <div class="field"><label>Categoría</label>
        <select id="n-cat">
          <option value="accesorios">accesorios</option>
          <option value="corporativo">corporativo</option>
          <option value="decoracion">decoracion</option>
          <option value="personalizado">personalizado</option>
          <option value="prototipo">prototipo</option>
        </select>
      </div>
      <div class="field"><label>Precio (USD) *</label><input id="n-price" type="number" step="0.01" placeholder="12.00"></div>
      <div class="field"><label>Material</label><input id="n-mat" placeholder="PLA, PETG, Resina..."></div>
      <div class="field"><label>Color</label><input id="n-color" placeholder="Negro, Blanco..."></div>
      <div class="field"><label>URL imagen</label><input id="n-img" placeholder="https://..."></div>
      <div class="field" style="grid-column:1/-1"><label>Descripción *</label>
        <textarea id="n-desc" placeholder="Descripción del producto..."></textarea>
      </div>
      <div class="field"><label>Destacado</label>
        <select id="n-featured"><option value="false">No</option><option value="true">Sí</option></select>
      </div>
      <div class="field"><label>Disponible</label>
        <select id="n-avail"><option value="true">Sí</option><option value="false">No</option></select>
      </div>
      <div class="field" style="align-self:end">
        <button class="btn btn-sage" id="add-btn" style="width:100%">Agregar producto</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── Config ────────────────────────────────────────────────────────────────────
const CATALOG_PW = "decus3d2026";   // change this in production

// ── Gate ──────────────────────────────────────────────────────────────────────
const gate = document.getElementById("gate");
const gateErr = document.getElementById("gate-err");
const gatePwd = document.getElementById("gate-pwd");

function tryUnlock() {
  if (gatePwd.value === CATALOG_PW) {
    gate.style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("status-bar").style.display = "flex";
    loadCatalog();
  } else {
    gateErr.textContent = "Contraseña incorrecta.";
    gatePwd.value = "";
    gatePwd.focus();
  }
}

document.getElementById("gate-btn").addEventListener("click", tryUnlock);
gatePwd.addEventListener("keydown", e => { if (e.key === "Enter") tryUnlock(); });
gatePwd.focus();

// ── State ──────────────────────────────────────────────────────────────────────
let catalog = { categories: [], products: [] };

// ── Toast ──────────────────────────────────────────────────────────────────────
function toast(msg, type = "") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show " + type;
  setTimeout(() => el.classList.remove("show"), 3000);
}

// ── Render products ────────────────────────────────────────────────────────────
function renderProducts() {
  const list = document.getElementById("prod-list");
  if (!catalog.products.length) {
    list.innerHTML = '<p style="color:var(--slate);font-size:.88rem">No hay productos. Cargá un catalog.json o agregá productos abajo.</p>';
    return;
  }
  list.innerHTML = catalog.products.map((p, i) => `
    <div class="prod-row" id="row-${i}">
      <div class="prod-index">${i + 1}</div>
      <div>
        <div class="prod-fields">
          <div class="field"><label>Nombre</label>
            <input value="${esc(p.name)}" onchange="update(${i},'name',this.value)"></div>
          <div class="field"><label>Categoría</label>
            <input value="${esc(p.category||'')}" onchange="update(${i},'category',this.value)"></div>
          <div class="field"><label>Precio USD</label>
            <input type="number" step="0.01" value="${p.price||0}" onchange="update(${i},'price',parseFloat(this.value))"></div>
          <div class="field"><label>Material</label>
            <input value="${esc(p.material||'')}" onchange="update(${i},'material',this.value)"></div>
          <div class="field"><label>Color</label>
            <input value="${esc(p.color||'')}" onchange="update(${i},'color',this.value)"></div>
          <div class="field"><label>URL imagen</label>
            <input value="${esc(p.image_url||'')}" onchange="update(${i},'image_url',this.value)"></div>
        </div>
        <div class="prod-fields wide" style="margin-top:.65rem">
          <div class="field"><label>Descripción</label>
            <textarea onchange="update(${i},'description',this.value)">${esc(p.description||'')}</textarea></div>
          <div class="prod-fields" style="gap:.65rem">
            <div class="field"><label>Destacado</label>
              <select onchange="update(${i},'featured',this.value==='true')">
                <option value="false" ${!p.featured?"selected":""}>No</option>
                <option value="true" ${p.featured?"selected":""}>Sí</option>
              </select></div>
            <div class="field"><label>Disponible</label>
              <select onchange="update(${i},'available',this.value==='true')">
                <option value="true" ${p.available!==false?"selected":""}>Sí</option>
                <option value="false" ${p.available===false?"selected":""}>No</option>
              </select></div>
          </div>
        </div>
      </div>
      <div class="prod-actions">
        <button class="btn btn-sm btn-danger" onclick="removeProduct(${i})">Eliminar</button>
        <button class="btn btn-sm btn-primary" onclick="moveUp(${i})" ${i===0?"disabled":""}>↑</button>
        <button class="btn btn-sm btn-primary" onclick="moveDown(${i})" ${i===catalog.products.length-1?"disabled":""}>↓</button>
      </div>
    </div>
  `).join("");
  document.getElementById("status-info").textContent = `${catalog.products.length} productos`;
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
}

function update(i, key, val) {
  catalog.products[i][key] = val;
}

function removeProduct(i) {
  if (!confirm(`¿Eliminar "${catalog.products[i].name}"?`)) return;
  catalog.products.splice(i, 1);
  renderProducts();
  toast("Producto eliminado", "");
}

function moveUp(i) {
  if (i === 0) return;
  [catalog.products[i-1], catalog.products[i]] = [catalog.products[i], catalog.products[i-1]];
  renderProducts();
}

function moveDown(i) {
  if (i >= catalog.products.length - 1) return;
  [catalog.products[i], catalog.products[i+1]] = [catalog.products[i+1], catalog.products[i]];
  renderProducts();
}

// ── Load catalog.json ──────────────────────────────────────────────────────────
async function loadCatalog() {
  try {
    const r = await fetch("catalog.json?" + Date.now());
    if (!r.ok) throw new Error("HTTP " + r.status);
    catalog = await r.json();
    renderProducts();
    toast("catalog.json cargado", "success");
  } catch(e) {
    document.getElementById("status-info").textContent = "Sin datos";
    toast("No se pudo cargar catalog.json — empezá desde cero", "error");
    renderProducts();
  }
}

document.getElementById("load-btn").addEventListener("click", loadCatalog);

// ── Add product ────────────────────────────────────────────────────────────────
document.getElementById("add-btn").addEventListener("click", () => {
  const name = document.getElementById("n-name").value.trim();
  const desc = document.getElementById("n-desc").value.trim();
  const price = parseFloat(document.getElementById("n-price").value) || 0;
  if (!name || !desc) { toast("Nombre y descripción son obligatorios", "error"); return; }
  catalog.products.push({
    id: "prod-" + Date.now(),
    name,
    description: desc,
    category: document.getElementById("n-cat").value,
    price,
    currency: "USD",
    material: document.getElementById("n-mat").value.trim(),
    color: document.getElementById("n-color").value.trim(),
    image_url: document.getElementById("n-img").value.trim() || null,
    featured: document.getElementById("n-featured").value === "true",
    available: document.getElementById("n-avail").value === "true",
  });
  // Reset form
  ["n-name","n-desc","n-price","n-mat","n-color","n-img"].forEach(id => {
    document.getElementById(id).value = "";
  });
  renderProducts();
  toast("Producto agregado", "success");
});

// ── Export JSON ────────────────────────────────────────────────────────────────
document.getElementById("export-btn").addEventListener("click", () => {
  // Rebuild categories from products
  const cats = [...new Set(catalog.products.map(p => p.category).filter(Boolean))];
  const categories = [
    { id: "todos", label: "Todos" },
    ...cats.map(c => ({ id: c, label: c.charAt(0).toUpperCase() + c.slice(1) }))
  ];
  const out = JSON.stringify({ categories, products: catalog.products }, null, 2);
  const blob = new Blob([out], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "catalog.json"; a.click();
  URL.revokeObjectURL(url);
  toast("catalog.json exportado — subilo al repo para publicar", "success");
});
</script>
</body>
</html>
